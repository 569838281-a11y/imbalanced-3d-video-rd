# @package _global_
# Stage-2: macula detached vs intact, 3D U-Net, 50 epochs (local, cached).
# Label in CSV: 1=Macula_Intact, 0=Macula_Detached (as provided by splits).
# Launch: scripts/start_macula_unet3d_50ep_local.ps1

defaults:
  - override /data: erdes_macula_cached
  - override /model: unet3d
  - override /callbacks: default
  - override /trainer: default
  - override /logger: csv

tags: ["erdes", "unet3d", "macula", "50ep", "local", "stage2"]

seed: 42
ckpt_path: null
test: false

trainer:
  min_epochs: 1
  max_epochs: 50
  gradient_clip_val: 1.0
  enable_progress_bar: true
  log_every_n_steps: 10
  precision: 16-mixed
  enable_checkpointing: true

model:
  optimizer:
    lr: 1.5e-05
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.1
    patience: 8
  compile: false
  net:
    model_name: unet3d
    pooling: topk
    topk_ratio: 0.5

data:
  batch_size: 2
  num_workers: 0
  use_cache: true
  cache_dir: "D:/ERDES/cache/macula_detached_vs_intact"
  train_csv: "data/splits/macula_detached_vs_intact/train.csv"
  val_csv: "data/splits/macula_detached_vs_intact/val.csv"
  test_csv: "data/splits/macula_detached_vs_intact/test.csv"

logger:
  csv:
    name: "csv"
    prefix: ""

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: "D:/ERDES/checkpoints/macula_unet3d_50ep_local"
    filename: "macula_unet3d_ep{epoch:03d}_f1{val/f1:.4f}_rec{val/sensitivity:.4f}"
    monitor: "val/f1"
    mode: "max"
    every_n_epochs: 5
    save_top_k: -1
    save_last: true
    auto_insert_metric_name: false
    verbose: true
    save_on_train_epoch_end: false
    save_weights_only: false

  model_checkpoint_best:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: "D:/ERDES/checkpoints/macula_unet3d_50ep_local"
    filename: "macula_unet3d_best"
    monitor: "val/f1"
    mode: "max"
    every_n_epochs: 1
    save_top_k: 1
    save_last: false
    auto_insert_metric_name: false
    verbose: true
    save_on_train_epoch_end: false
    save_weights_only: false

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "val/f1"
    patience: 12
    mode: "max"
    min_delta: 0.001
    check_on_train_epoch_end: false
    strict: false
    verbose: true

  model_summary: null
  rich_progress_bar: null

  training_progress:
    _target_: erdes.callbacks.training_progress_callback.TrainingProgressCallback
    log_every_n_steps: 10
    progress_log_file: "D:/ERDES/logs/macula_unet3d_50ep_progress.log"

hydra:
  run:
    dir: logs/train/runs/md/unet3d_50ep/${now:%Y-%m-%d_%H-%M-%S}
