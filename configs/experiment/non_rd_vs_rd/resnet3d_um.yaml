# @package _global_
# Experiment 2: baseline ResNet3D + Unsharp Masking (UM), 15 epochs.
# Model architecture unchanged; only data preprocessing differs from resnet3d.

defaults:
  - override /data: erdes_um
  - override /model: resnet3d
  - override /callbacks: default
  - override /trainer: default
  - override /logger: tensorboard

tags: ["erdes", "resnet3d", "um", "non_rd_vs_rd"]

seed: 42

trainer:
  min_epochs: 15
  max_epochs: 15
  gradient_clip_val: 0.0
  log_every_n_steps: 10

model:
  optimizer:
    lr: 1.5e-05
  compile: false

data:
  use_um: true
  um_strength: 1.5
  batch_size: 4
  num_workers: 0
  train_csv: "data/splits/non_rd_vs_rd/train.csv"
  val_csv: "data/splits/non_rd_vs_rd/val.csv"
  test_csv: "data/splits/non_rd_vs_rd/test.csv"

logger:
  tensorboard:
    prefix: "resnet3d_um"

callbacks:
  model_checkpoint:
    dirpath: ${paths.output_dir}/checkpoints/resnet3d_um
    filename: "resnet3d_um_best_epoch_{epoch:03d}"
    monitor: "val/acc"
    mode: "max"
    save_top_k: 1
    save_last: true
    auto_insert_metric_name: false
    verbose: true

  rich_progress_bar: null

  training_progress:
    _target_: erdes.callbacks.training_progress_callback.TrainingProgressCallback
    log_every_n_steps: 10
    progress_log_file: "D:/ERDES/logs/resnet3d_um_progress.log"

hydra:
  run:
    dir: logs/train/runs/rd/resnet3d_um/${now:%Y-%m-%d_%H-%M-%S}
