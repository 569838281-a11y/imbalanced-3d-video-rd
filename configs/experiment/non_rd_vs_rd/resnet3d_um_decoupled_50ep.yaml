# @package _global_
# UM sharpening + two-stage decoupled training, 50 epochs (Kaggle / long run).
# Prerequisites:
#   1) UM tensor cache (scripts/build_um_cache.py) uploaded to Kaggle Dataset
#   2) CSV splits uploaded
# Launch (from repo root on Kaggle):
#   python erdes/train.py experiment=non_rd_vs_rd/resnet3d_um_decoupled_50ep

defaults:
  - override /data: erdes_um_cached_kaggle
  - override /model: resnet3d_decoupled
  - override /callbacks: decoupled
  - override /trainer: default
  - override /logger: csv

tags: ["erdes", "resnet3d", "um", "decoupled", "50ep", "kaggle", "non_rd_vs_rd"]

seed: 42

trainer:
  min_epochs: 1
  max_epochs: 50
  gradient_clip_val: 1.0
  enable_progress_bar: true
  log_every_n_steps: 20
  precision: 16-mixed
  accelerator: gpu
  devices: 1

model:
  train_csv: ${data.train_csv}
  # ~76% stage1 / ~24% stage2 for 50 epochs (scaled from 11/15)
  stage1_end_epoch: 38
  stage2_start_epoch: 38
  total_epochs: 50
  logit_adjustment_tau: 1.0
  mixup_alpha: 0.2
  mixup_enabled: true
  stage2_lr: 1.5e-05
  decision_threshold: 0.5
  gpu_preprocess: false
  compute_train_metrics: true
  metrics_csv_name: "epoch_metrics.csv"
  compile: false
  optimizer:
    lr: 1.5e-05
  scheduler:
    patience: 10
    mode: max

data:
  batch_size: 4
  num_workers: 2
  persistent_workers: false
  use_cache: true
  use_um: true
  um_strength: 1.5

logger:
  csv:
    name: "csv"
    prefix: ""

callbacks:
  model_checkpoint:
    dirpath: ${paths.output_dir}/checkpoints/resnet3d_um_decoupled
    filename: "um_decoupled_50ep_epoch_{epoch:03d}_f1{val/f1:.4f}_rec{val/recall:.4f}"
    monitor: "val/f1"
    mode: "max"
    save_top_k: 3
    save_last: true
    auto_insert_metric_name: false
    verbose: true

  early_stopping:
    monitor: "val/f1"
    patience: 15
    mode: "max"
    min_delta: 0.001

  rich_progress_bar: null

  training_progress:
    _target_: erdes.callbacks.training_progress_callback.TrainingProgressCallback
    log_every_n_steps: 20
    progress_log_file: ${paths.output_dir}/train_progress.log

  pr_threshold_search:
    _target_: erdes.callbacks.pr_threshold_callback.PRThresholdSearchCallback
    min_precision: 0.5
    save_plot: true
    results_filename: "best_threshold.json"
    plot_filename: "pr_curve_val.png"

hydra:
  run:
    dir: logs/train/runs/rd/resnet3d_um_decoupled_50ep/${now:%Y-%m-%d_%H-%M-%S}
