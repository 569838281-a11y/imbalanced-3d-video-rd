# @package _global_
# Baseline ResNet3D + offline UM cache (~same speed as baseline cached path).
# Prerequisite: python scripts/build_um_cache.py --split train_val --workers 4

defaults:
  - override /data: erdes_um_cached
  - override /model: resnet3d
  - override /callbacks: default
  - override /trainer: default
  - override /logger: tensorboard

tags: ["erdes", "resnet3d", "um", "fast", "non_rd_vs_rd"]

seed: 42

trainer:
  min_epochs: 15
  max_epochs: 15
  gradient_clip_val: 0.0
  log_every_n_steps: 10

model:
  optimizer:
    lr: 1.5e-05
  compile: false

data:
  batch_size: 4
  num_workers: 0
  use_um: true
  um_strength: 1.5

logger:
  tensorboard:
    prefix: "resnet3d_um_fast"

callbacks:
  model_checkpoint:
    dirpath: ${paths.output_dir}/checkpoints/resnet3d_um
    filename: "resnet3d_um_fast_epoch_{epoch:03d}"
    monitor: "val/acc"
    mode: "max"
    save_top_k: 1
    save_last: true
    auto_insert_metric_name: false
    verbose: true

  rich_progress_bar: null

  training_progress:
    _target_: erdes.callbacks.training_progress_callback.TrainingProgressCallback
    log_every_n_steps: 10
    progress_log_file: "D:/ERDES/logs/resnet3d_um_fast_progress.log"

hydra:
  run:
    dir: logs/train/runs/rd/resnet3d_um_fast/${now:%Y-%m-%d_%H-%M-%S}
