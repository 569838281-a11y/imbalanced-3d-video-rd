# MONAI Swin-UNETR with official SSL encoder weights + classification head
_target_: erdes.models.model_module.ModelModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10

net:
  _target_: erdes.models.components.monai_ssl_swinunetr.build_monai_ssl_swinunetr_classifier
  num_classes: 1
  pooling: avg
  topk_ratio: 0.5
  load_ssl: true
  ssl_weights_path: null
  feature_size: 48

compile: false
